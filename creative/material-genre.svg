<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Hiragino Sans,Noto Sans JP,sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#fffaf4" stroke="none"/><text x="76" y="120" font-size="28" font-weight="700" fill="#9a3657">SAKI / LIVE WORKSHEET</text><text x="76" y="182" font-size="25" font-weight="700" fill="#6c6766">説明用・進行検討用の仮資料／成果の証拠ではありません</text><text x="76" y="320" font-size="52" font-weight="700" fill="#15191d">ジャンル転用の比較シート</text><rect x="76" y="440" width="928" height="120" rx="16" fill="#f1e7e6" stroke="none"/><text x="102" y="512" font-size="32" font-weight="600" fill="#15191d">共通：読者の状況を先に絞る</text><rect x="76" y="582" width="928" height="120" rx="16" fill="#f1e7e6" stroke="none"/><text x="102" y="654" font-size="32" font-weight="600" fill="#15191d">変える：読む人の言葉と具体的な場面</text><rect x="76" y="724" width="928" height="120" rx="16" fill="#f1e7e6" stroke="none"/><text x="102" y="796" font-size="32" font-weight="600" fill="#15191d">共通：一枚で伝えることを一つにする</text><rect x="76" y="866" width="928" height="120" rx="16" fill="#f1e7e6" stroke="none"/><text x="102" y="938" font-size="32" font-weight="600" fill="#15191d">変える：必要な実物・判断・注意点</text><rect x="76" y="1008" width="928" height="120" rx="16" fill="#f1e7e6" stroke="none"/><text x="102" y="1080" font-size="32" font-weight="600" fill="#15191d">確認：他人の成果や体験は移植しない</text><text x="76" y="1270" font-size="25" font-weight="500" fill="#6c6766">運用方法の説明例。本人の材料・実演内容に合わせて調整。</text></g></svg>