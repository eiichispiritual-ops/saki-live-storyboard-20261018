<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Hiragino Sans,Noto Sans JP,sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#fffaf4" stroke="none"/><text x="76" y="120" font-size="28" font-weight="700" fill="#9a3657">SAKI / LIVE WORKSHEET</text><text x="76" y="182" font-size="25" font-weight="700" fill="#6c6766">説明用・進行検討用の仮資料／成果の証拠ではありません</text><text x="76" y="320" font-size="52" font-weight="700" fill="#15191d">AIに渡す材料シート</text><rect x="76" y="440" width="928" height="120" rx="16" fill="#f1e7e6" stroke="none"/><text x="102" y="512" font-size="32" font-weight="600" fill="#15191d">誰に：夜、投稿の言葉を直し続ける人</text><rect x="76" y="582" width="928" height="120" rx="16" fill="#f1e7e6" stroke="none"/><text x="102" y="654" font-size="32" font-weight="600" fill="#15191d">場面：書き直しても自分の言葉にならない</text><rect x="76" y="724" width="928" height="120" rx="16" fill="#f1e7e6" stroke="none"/><text x="102" y="796" font-size="32" font-weight="600" fill="#15191d">経験：本人が実際に見たこと・試したこと</text><rect x="76" y="866" width="928" height="120" rx="16" fill="#f1e7e6" stroke="none"/><text x="102" y="938" font-size="32" font-weight="600" fill="#15191d">目的：今回は一つの気づきを持ち帰る</text><rect x="76" y="1008" width="928" height="120" rx="16" fill="#f1e7e6" stroke="none"/><text x="102" y="1080" font-size="32" font-weight="600" fill="#15191d">条件：未確認の成果や体験を足さない</text><text x="76" y="1270" font-size="25" font-weight="500" fill="#6c6766">運用方法の説明例。本人の材料・実演内容に合わせて調整。</text></g></svg>