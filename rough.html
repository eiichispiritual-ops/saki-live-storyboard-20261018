<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>さき｜ストーリーの見た目ラフ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#272727;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:1220px;margin:auto;padding:35px 25px}h1{font-size:28px;margin:0 0 14px}p{font-size:13px;line-height:1.9;color:#666}.actions{display:flex;gap:20px;align-items:center;margin:20px 0 30px}button,a{font:inherit;font-size:12px;color:#254f4a}button{padding:12px 18px;background:white;border:1px solid #ccc;border-radius:8px;cursor:pointer}#samples{display:grid;grid-template-columns:repeat(3,1fr);gap:32px 20px}figure{margin:0;min-width:0}.label{font-size:13px;margin-bottom:10px;font-weight:700}img{display:block;width:100%;border-radius:12px}figcaption{font-size:12px;line-height:1.8;color:#666;margin-top:10px}@media(max-width:950px){#samples{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){#samples{grid-template-columns:1fr}}</style></head><body><main><h1>説明より、こんな見た目。</h1><p><a href="connected.html"><b>最新：15〜17日の18枚を続けて見る →</b></a></p><p>本人写真を残す／文字を短く大きく／スクショは重ねる／強調は一か所。<br>見た目だけの仮案です。灰色の画面・伏せた数字は差し替え位置で、実績や返信ではありません。</p><div class="actions"><button id="export">6枚をPNG保存</button><a href="rough-png.zip" download>PNG一括保存</a><a href="rough-svg.zip" download>SVG保存</a><a href="index.html">構成へ</a></div><p id="status" role="status"></p><div id="samples"></div></main><script src="rough.js"></script></body></html>
